[tox]
requires =
    tox>=4.24.1
    tox-uv>=1.23
env_list =
    3.14
    lint
    type
skip_missing_interpreters = true

[testenv]
runner = {env:TOX_RUNNER:uv-venv-lock-runner}
description = run the unit tests with pytest under {base_python}
pass_env =
    PYTEST_*
commands =
    python -m pytest {tty:--color=yes} \
      --cov=jormungandr --cov-branch \
      --cov-report=xml --cov-report=html \
      --cov-report term-missing:skip-covered \
      --junitxml=junit.xml -o junit_family=legacy \
      {posargs:tests}
dependency_groups = test

; Deliberately outside env_list: a bare `tox` must not need a daemon.
; Run it explicitly with `tox -e docker`. The `-m docker` on the command line
; overrides the `-m 'not docker'` in addopts, which is how these are selected.
; base_python is explicit on every env whose name does not carry a version.
; Without it tox uses whatever interpreter tox itself runs on, and `uv sync`
; then refuses it against requires-python — which is a confusing way to
; discover that you launched tox from an older Python.
[testenv:docker]
base_python = py314
runner = {env:TOX_RUNNER:uv-venv-lock-runner}
description = run the tests that need a Docker daemon
pass_env =
    PYTEST_*
    DOCKER_HOST
commands =
    python -m pytest {tty:--color=yes} -m docker {posargs:tests}
dependency_groups = test

[testenv:lint]
base_python = py314
runner = {env:TOX_RUNNER:uv-venv-lock-runner}
description = lint and format-check the code base
commands =
    ruff check {posargs:.}
    ruff format --check {posargs:.}
dependency_groups = lint

[testenv:type]
base_python = py314
runner = {env:TOX_RUNNER:uv-venv-lock-runner}
description = run type check on code base
commands =
    mypy {posargs:src}
dependency_groups = type

[gh.python]
"3.14" = ["3.14", "lint", "type"]
